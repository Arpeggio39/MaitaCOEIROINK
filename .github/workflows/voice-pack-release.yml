name: Release Voice Pack

on:
  push:
    branches:
      - main
    paths:
      - 'bionmaita/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'package.json の version を自動で上げる（none なら現在値で Release のみ）'
        required: false
        type: choice
        default: minor
        options:
          - minor
          - none
          - patch
          - major
      force:
        description: '既存のアセットがあっても再ビルドする'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Publish voice pack
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Setup Git LFS
        run: git lfs install

      - name: Pull LFS objects
        run: git lfs pull

      - name: Bump version manually
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bump-version.cjs "${{ inputs.bump }}"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $version"
            exit 1
          fi
          artifact="bionmaita-$version.zip"
          args=(--artifact "$artifact")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          node scripts/resolve-release-version.cjs "${args[@]}"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bump != 'none')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Skip if artifact already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested."
            exit 0
          fi
          tag="${{ steps.version.outputs.tag }}"
          artifact="bionmaita-${{ steps.version.outputs.version }}.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag not found. Will build."
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$artifact"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Artifact $artifact already exists on $tag. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag exists but $artifact is missing. Will build."
          fi

      - name: Ensure release tag exists
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Ensure GitHub Release exists
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" \
            --title "OpenMaita $version" \
            --notes "OpenMaita $version（音声パック）" \
            --verify-tag \
            --latest=false

      - name: Build voice pack zip
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(node scripts/build-voice-pack.cjs "${{ steps.version.outputs.version }}")"
          ls -lh "$artifact"

      - name: Upload voice pack to GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          artifact="bionmaita-${{ steps.version.outputs.version }}.zip"
          gh release upload "$tag" "$artifact" --clobber
