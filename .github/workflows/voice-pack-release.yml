name: Release Voice Pack

on:
  push:
    branches:
      - main
    paths:
      - 'bionmaita/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'package.json の version を自動で上げる（none なら現在値で Release のみ）'
        required: false
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major
      force:
        description: '既存のアセットがあっても再ビルドする'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump app version
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump version
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ inputs.bump }}" --no-git-tag-version
          new_version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${new_version}"
          git push origin HEAD:main

  release:
    name: Publish voice pack
    if: github.event_name != 'workflow_dispatch' || inputs.bump == 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Git LFS
        run: git lfs install

      - name: Pull LFS objects
        run: git lfs pull

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact=bionmaita-$version.zip" >> "$GITHUB_OUTPUT"
          echo "Voice pack version: $version (OpenMaita unified)"

      - name: Skip if artifact already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested."
            exit 0
          fi
          tag="${{ steps.version.outputs.tag }}"
          artifact="${{ steps.version.outputs.artifact }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag not found. Will build."
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$artifact"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Artifact $artifact already exists on $tag. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag exists but $artifact is missing. Will build."
          fi

      - name: Ensure release tag exists
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Ensure GitHub Release exists
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" \
            --title "OpenMaita $version" \
            --notes "OpenMaita $version（音声パック）" \
            --verify-tag \
            --latest=false

      - name: Build voice pack zip
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          artifact="${{ steps.version.outputs.artifact }}"
          staging="dist-voice-pack/bionmaita-$version"
          rm -rf dist-voice-pack
          mkdir -p "$staging"
          rsync -a bionmaita/ "$staging/"
          (cd dist-voice-pack && zip -r "../$artifact" "bionmaita-$version")
          rm -rf dist-voice-pack
          ls -lh "$artifact"

      - name: Upload voice pack to GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          artifact="${{ steps.version.outputs.artifact }}"
          gh release upload "$tag" "$artifact" --clobber
