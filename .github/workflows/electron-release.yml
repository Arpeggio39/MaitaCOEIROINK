name: Release Electron (Windows)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'bionmaita/**'
      - '.github/workflows/voice-pack-release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '既存 Release があっても再ビルドする'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Build and test C SIMD module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install WebAssembly compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm run build:native
      - run: node --test tests/native-lip-sync.test.mjs

  verify:
    name: Test and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package Windows installer
        if: github.event_name == 'pull_request'
        run: npm run dist:win

      - name: Verify upgrade from 1.9.0
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'old-installer'
          New-Item -ItemType Directory -Force $old | Out-Null
          gh release download v1.9.0 --pattern 'OpenMaita-Setup-1.9.0.exe' --dir $old
          if ($LASTEXITCODE -ne 0) { throw 'Old installer download failed' }
          $install = Join-Path $env:RUNNER_TEMP 'OpenMaitaUpgrade'
          $profile = Join-Path $env:RUNNER_TEMP 'OpenMaitaUpgradeProfile'
          $oldSetup = Join-Path $old 'OpenMaita-Setup-1.9.0.exe'
          $process = Start-Process $oldSetup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Old install failed' }
          $exe = Join-Path $install 'OpenMaita.exe'
          node scripts/verify-installed-upgrade.cjs seed $exe $profile
          if ($LASTEXITCODE -ne 0) { throw 'Old application fixture failed' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Join-Path $PWD "dist/OpenMaita-Setup-$version.exe"
          $process = Start-Process $setup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Upgrade install failed' }
          node scripts/verify-installed-upgrade.cjs verify $exe $profile
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded application verification failed' }

  release:
    name: Publish Windows release
    if: github.event_name != 'pull_request'
    needs: [verify, native]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Git LFS
        shell: pwsh
        run: git lfs install

      - name: Pull LFS objects
        shell: pwsh
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args = @()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.force }}' -eq 'true') {
            $args += '--force'
          }
          node scripts/resolve-release-version.cjs @args
          Write-Host "Release version: v${{ steps.version.outputs.version }}"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Skip if release already exists
        id: check
        shell: pwsh
        run: |
          if ('${{ steps.version.outputs.skip }}' -eq 'True') {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release skipped."
            exit 0
          }
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Will build v${{ steps.version.outputs.version }}."

      - name: Ensure release tag exists
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags --force
          git show-ref --tags --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Ensure GitHub Release exists
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          gh release create $tag --title "OpenMaita $version" --verify-tag --latest

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build and publish to GitHub Releases
        if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build voice pack zip
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: node scripts/build-voice-pack.cjs

      - name: Upload voice pack to GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $artifact = "bionmaita-1.0.0.zip"
          gh release upload $tag $artifact --clobber

      - name: Mark release as latest
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release edit $tag --latest
          Write-Host "Marked $tag as latest."
