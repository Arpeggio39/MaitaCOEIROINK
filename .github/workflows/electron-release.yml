name: Release Electron (Windows)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'bionmaita/**'
      - '.github/workflows/voice-pack-release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '既存 Release があっても再ビルドする'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package Windows app
        if: github.event_name == 'pull_request'
        run: npm run dist:win:dir

  release:
    name: Publish Windows release
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args = @()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.force }}' -eq 'true') {
            $args += '--force'
          }
          node scripts/resolve-release-version.cjs @args
          Write-Host "Release version: v${{ steps.version.outputs.version }}"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Skip if release already exists
        id: check
        shell: pwsh
        run: |
          if ('${{ steps.version.outputs.skip }}' -eq 'True') {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release skipped."
            exit 0
          }
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Will build v${{ steps.version.outputs.version }}."

      - name: Ensure release tag exists
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags --force
          git show-ref --tags --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Ensure GitHub Release exists
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          gh release create $tag --title "OpenMaita $version" --verify-tag --latest

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build and publish to GitHub Releases
        if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark release as latest
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release edit $tag --latest
          Write-Host "Marked $tag as latest."
